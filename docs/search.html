<script id="search-index" type="application/json">[{"title":"The different world","kind":"Thought","kindHref":"notes.html","href":"posts/the-different-world.html","when":"10 Nov 2026, 9:42 pm","text":"The different world The world is not just trivial or simple. Philosophy without thc or psychedelics is nothing but a rant on the existing world. These 'out of world' experiences while still 'in the… The world is not just trivial or simple. Philosophy without thc or psychedelics is nothing but a rant on the existing world. These 'out of world' experiences while still 'in the world' are only possible because of the sine qua non of sensory perception. The physical anchor of 'reality' seems to be 'broken' but who knows, the what if these substances give you the heightened senses, and after all extremes are where answers are found and things are not boring. Maybe that's why, a person who has the ability to achieve total silence along with the ability to be comfortable in the highest senses is the one who is panoptic, attained full comprehension and has achieved omniscience. It's like this, is h world looks small from the airplane, and so the problems do too. Same way.. the more extremes you get to see, the more the normal seems to get less prominence and more inconsequential"},{"title":"Continuous Improvement","kind":"Quote","kindHref":"quotes.html","href":"posts/continuous-improvement.html","when":"10 Nov 2026, 5:35 pm","text":"Continuous Improvement The electric light did not come from the continuous improvement of candles The electric light did not come from the continuous improvement of candles Historians and designers note that real-world innovation is rarely a sudden magic trick. Electric lighting systems still relied on prior networks, engineering iterations, and existing subcomponents rather than appearing out of nowhere."},{"title":"Desire should be your Strength","kind":"Quote","kindHref":"quotes.html","href":"posts/desire-should-be-your-strength.html","when":"9 Nov 2026, 3:51 pm","text":"Desire should be your Strength Sometimes the thing you want most is the one holding you down. Unless you dissociate and solve Sometimes the thing you want most is the one holding you down. Unless you dissociate and solve"},{"title":"జాబిలి - the imperfect reprasentation of beauty","kind":"Essay","kindHref":"essays.html","href":"posts/moon-the-imperfect-beauty.html","when":"9 Nov 2026, 1:04 am","text":"జాబిలి - the imperfect reprasentation of beauty The moon has been a romantic's embodiment of a మన్మథీ's love for time immemorial 1. The moon is perhaps the best representation of a మన్మథీ. While begrudgingly trotting towards the campus gate in the intense summer heat of 2024, I eyes glanced up at the evening sky as I muttered curses underneath my breath at the bitter realisation that going to the gate also meant walking back to hostel.. taking the same drab route. As my eyes scanned the cerulean blue sky glancing at the scattered wisps drifting leisurely when the bright ball of intensity almost blinded me. A few frolicking birds flew around me when something caught me by surprise, and the moment I say it, it became the absolute cynosure of my eyes. The pearl drop in the sky.. contrasted by the vivid backdrop made me whisper, 'The moon looks beautiful'.. My friend who had been silent till now, brooding in his own thoughts felt a need to reply to the statement. He tells me in a slow voice, 'the moon looks pretty only when you're thinking of someone you like..'. I scoffed at what he said. 'There's no way that can be true!' I exclaimed. 'I don't see the appeal'. The moon to me just looked like something that was put in place to fill the repetitive and monotonous sky. After all, something that's supposed to remind me of someone I like should be silken and luminous, not filled with blotches of grey and pummelled with craters. Then the a sudden epiphany hit me. The moon is the perfect reflection of a lover because it is the way it is... imperfect After a few moments of rumination, the moon to me was the absolute quintessence - the very personification of a lover."},{"title":"Life's gift","kind":"Quote","kindHref":"quotes.html","href":"posts/life-from-now.html","when":"8 Nov 2026, 5:49 pm","text":"Life's gift Life didn't give me the one thing I really wanted. So I'm going to make it give me everything else. Life didn't give me the one thing I really wanted. So I'm going to make it give me everything else."},{"title":"Perspective","kind":"Quote","kindHref":"quotes.html","href":"posts/perspective.html","when":"8 Nov 2026, 5:17 pm","text":"Perspective One cannot step in the same river twice One cannot step in the same river twice"},{"title":"Knowledge and Wisdom","kind":"Quote","kindHref":"quotes.html","href":"posts/knowledge-and-wisdom.html","when":"8 Nov 2026, 3:55 pm","text":"Knowledge and Wisdom Knowledge is knowing tomato is a fruit. Wisdom is knowing not to put it in a fruit salad. Knowledge is knowing tomato is a fruit. Wisdom is knowing not to put it in a fruit salad."},{"title":"A place to put things down","kind":"Essay","kindHref":"essays.html","href":"posts/a-place-to-put-things-down.html","when":"8 Nov 2026, 3:12 am","text":"A place to put things down A plain page for notes, quotations, and longer pieces. I wanted one page for the writing that does not fit anywhere else. A line copied out of a book. A thought that is too long for a message. An account of something that happened, written out at the length it actually needs. This is that page. A list of pieces, then the piece. The type sits in a narrow column. Three kinds of piece A note is short. A few paragraphs, written when the thought showed up, left at that length. A quote is someone else's sentence. Their name goes with it, and the book or the essay it came from, so the line can be found again without hunting through underlines. The words stay theirs. An essay is the long form. An experience, an argument, or a subject I want to be able to reread in a year and still follow. A piece should be worth rereading. If it is not, it does not belong here. Why the longer ones exist Most of what gets written in the middle of a day is a reply. It makes sense next to the message it answers, and then the thread moves on. A longer piece has to stand on its own. It needs a title, a beginning, and an ending. That is what an essay is for here. A note can stay a note. A quotation can be a post by itself. Neither has to be stretched until it looks finished. This first one is the introduction. The rest will be the actual writing."},{"title":"Keep the name with the quote","kind":"Thought","kindHref":"notes.html","href":"posts/keep-the-name-with-the-quote.html","when":"7 Nov 2026, 3:01 am","text":"Keep the name with the quote A quotation without the person who wrote it is a line I will not be able to trust later. A sentence I liked is easy to save and easy to lose. What goes missing is the name, and where it was printed. When a quotation is posted here, the name stays attached to it, and so does the book or the essay. Credit is part of the post."}]</script>
