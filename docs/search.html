lse's sentence. Their name goes with it, and the book or the essay it came from, so the line can be found again without hunting through underlines. The words stay theirs. An essay is the long form. An experience, an argument, or a subject I want to be able to reread in a year and still follow. A piece should be worth rereading. If it is not, it does not belong here. Why the longer ones exist Most of what gets written in the middle of a day is a reply. It makes sense next to the message it answers, and then the thread moves on. A longer piece has to stand on its own. It needs a title, a beginning, and an ending. That is what an essay is for here. A note can stay a note. A quotation can be a post by itself. Neither has to be stretched until it looks finished. This first one is the introduction. The rest will be the actual writing."},{"title":"Keep the name with the quote","kind":"Thought","kindHref":"notes.html","href":"posts/keep-the-name-with-the-quote.html","when":"7 Nov 2026, 3:01 am","text":"Keep the name with the quote A quotation without the person who wrote it is a line I will not be able to trust later. A sentence I liked is easy to save and easy to lose. What goes missing is the name, and where it was printed. When a quotation is posted here, the name stays attached to it, and so does the book or the essay. Credit is part of the post."},{"title":"Curious","kind":"Quote","kindHref":"quotes.html","href":"posts/curious.html","when":"7 Nov 2026","text":"Curious The sdkjf lsdkjflajkh The sdkjf lsdkjflajkh"}]</script>
