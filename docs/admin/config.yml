backend:
  name: github
  repo: Yolocherry123/vardhan-writing
  branch: main
  auth_methods: [token]

media_folder: writing/images
public_folder: /images

collections:
  - name: writing
    label: Writing
    label_singular: Piece
    folder: writing
    create: true
    extension: md
    format: frontmatter
    slug: "{{date | date('YYYY-MM-DD')}}-{{slug}}"
    fields:
      - label: Title
        name: title
        widget: string
      - label: Date
        name: date
        widget: datetime
        time_format: true
        input_timezone: Asia/Kolkata
        default: "{{now}}"
      - label: Kind
        name: kind
        widget: select
        default: note
        options:
          - { label: Essay, value: essay }
          - { label: Thought, value: note }
          - { label: Quote, value: quote }
      - label: Summary
        name: summary
        widget: string
        required: false
        hint: "Required for an essay or a thought. One sentence. A quote can leave this blank."
      - label: Attribution
        name: attribution
        widget: string
        required: false
        hint: "Required for a quote. The person who wrote the words."
      - label: Source
        name: source
        widget: string
        required: false
        hint: "For a quote, the book or essay, if you have it."
      - label: Alignment
        name: align
        widget: select
        default: center
        options:
          - { label: Center, value: center }
          - { label: Ragged center, value: ragged }
          - { label: Left, value: left }
          - { label: Right, value: right }
          - { label: Justify, value: justify }
        hint: "How the body text sits on the page."
      - label: Body
        name: body
        widget: markdown
  - name: site
    label: Site
    files:
      - label: Site settings
        name: settings
        file: site.config.json
        format: json
        fields:
          - { label: Site name, name: title, widget: string }
          - label: Tagline
            name: description
            widget: markdown
            hint: "Shown under the site name. Marks, pictures, and videos work here."
          - { label: Author, name: author, widget: string }
          - label: About
            name: about
            widget: markdown
            hint: "Shown on the About page. Marks, alignment, pictures, and videos work here."
          - label: Public URL
            name: url
            widget: string
            required: false
            hint: "The live address, with no slash at the end, such as https://username.github.io/vardhan-writing. This turns on the RSS feed."
